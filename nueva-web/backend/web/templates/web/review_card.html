{% if review.google_destination %}<a class="review review-card" href="{{ review.google_destination }}" target="_blank" rel="noopener noreferrer" aria-label="{% if review.has_direct_google_review %}Ver la reseña de {{ review.author }} en Google{% else %}Ver las reseñas de ROMILUZ en Google. Opinión mostrada: {{ review.author }}{% endif %} (se abre en otra pestaña)">{% else %}<div class="review">{% endif %}<figure class="review-content"><div class="stars" aria-label="{{ review.rating }} de 5 estrellas">{% if review.rating == 5 %}★★★★★{% elif review.rating == 4 %}★★★★☆{% elif review.rating == 3 %}★★★☆☆{% elif review.rating == 2 %}★★☆☆☆{% else %}★☆☆☆☆{% endif %}</div><blockquote>{{ review.body }}</blockquote><figcaption>{{ review.author }}</figcaption></figure>{% if review.google_destination %}<span class="review-source-text">{% if review.has_direct_google_review %}Ver esta reseña en Google{% else %}Ver reseñas en Google{% endif %} <span aria-hidden="true">↗</span></span></a>{% else %}</div>{% endif %}
