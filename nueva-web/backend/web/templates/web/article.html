{% extends 'web/base.html' %}{% block title %}{{ article.title }}{% endblock %}{% block content %}<article class="wrap section prose"><p>{{ article.category }}</p><h1>{{ article.title }}</h1>{% if article.cover %}<img src="{% url 'content-image' 'article' article.pk %}" alt="{{ article.image_alt }}">{% endif %}{{ article.body|urlize|linebreaks }}<p>Actualizado: {{ article.updated|date:'d/m/Y' }}</p><a href="{% url 'blog' %}">Volver al blog</a></article>{% endblock %}
