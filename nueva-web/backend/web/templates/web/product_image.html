{% load static %}{% if product.image %}<img src="{% url 'content-image' 'equipo' product.pk %}" alt="{{ product.brand.name }} {{ product.title }}" loading="lazy" width="480" height="360">{% else %}{% get_static_prefix as STATIC_PREFIX %}<img src="{{ STATIC_PREFIX }}assets/{{ product.asset }}" alt="{{ product.brand.name }} {{ product.title }}" loading="lazy" width="480" height="360">{% endif %}
