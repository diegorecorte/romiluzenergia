name: Comprobar nueva web
on:
  push:
    branches: [nueva-web-romiluz]
    paths: ['nueva-web/**', '.github/workflows/nueva-web.yml']
  pull_request:
    paths: ['nueva-web/**', '.github/workflows/nueva-web.yml']
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nueva-web/backend/requirements.txt
      - run: pip install -r nueva-web/backend/requirements.txt
      - run: python nueva-web/backend/manage.py collectstatic --noinput
      - run: python nueva-web/backend/manage.py check
      - run: python nueva-web/backend/manage.py makemigrations --check --dry-run
      - run: python nueva-web/backend/manage.py test web
      - run: node --check nueva-web/backend/web/static/web/main.js
      - run: node --check nueva-web/backend/web/static/web/energy-3d.mjs
      - run: node --test nueva-web/backend/tests/energy-state.test.mjs
